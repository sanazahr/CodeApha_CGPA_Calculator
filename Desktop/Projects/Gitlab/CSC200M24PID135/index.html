<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klondike Solitaire</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <header>
            <h1>Klondike Solitaire</h1>
            <div class="game-controls">
                <div class="controls-left">
                    <button id="new-game">New Game</button>
                    <button id="undo-btn" disabled>Undo</button>
                    <button id="redo-btn" disabled>Redo</button>
                    <button id="hint-btn">Hint</button>
                </div>
                <div class="game-stats">
                    <div class="stat-item">
                        <span class="stat-label">Time:</span>
                        <span id="time" class="stat-value">00:00</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Score:</span>
                        <span id="score" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Moves:</span>
                        <span id="moves" class="stat-value">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">Stock:</span>
                        <span id="stock-count" class="stat-value">24</span>
                    </div>
                </div>
            </div>
        </header>
        
        <div class="game-area">
            <div class="game-board">
                <!-- Stock and Waste piles -->
                <div class="top-row">
                    <div class="pile-container">
                        <div class="pile stock" id="stock">
                            <!-- Stock pile will be populated with cards -->
                        </div>
                        <div class="pile-label">Stock</div>
                    </div>
                    <div class="pile-container">
                        <div class="pile waste" id="waste">
                            <!-- Waste pile will be populated with cards -->
                        </div>
                        <div class="pile-label">Waste</div>
                    </div>
                    <div class="foundation-spacer"></div>
                    <!-- Foundation piles -->
                    <div class="pile-container">
                        <div class="foundation-pile" id="foundation-0" data-suit="hearts"></div>
                        <div class="pile-label">Hearts</div>
                    </div>
                    <div class="pile-container">
                        <div class="foundation-pile" id="foundation-1" data-suit="diamonds"></div>
                        <div class="pile-label">Diamonds</div>
                    </div>
                    <div class="pile-container">
                        <div class="foundation-pile" id="foundation-2" data-suit="clubs"></div>
                        <div class="pile-label">Clubs</div>
                    </div>
                    <div class="pile-container">
                        <div class="foundation-pile" id="foundation-3" data-suit="spades"></div>
                        <div class="pile-label">Spades</div>
                    </div>
                </div>
                
                <!-- Tableau piles -->
                <div class="tableau-row">
                    <div class="tableau-container">
                        <div class="tableau-pile" id="tableau-0"></div>
                        <div class="tableau-label">1</div>
                    </div>
                    <div class="tableau-container">
                        <div class="tableau-pile" id="tableau-1"></div>
                        <div class="tableau-label">2</div>
                    </div>
                    <div class="tableau-container">
                        <div class="tableau-pile" id="tableau-2"></div>
                        <div class="tableau-label">3</div>
                    </div>
                    <div class="tableau-container">
                        <div class="tableau-pile" id="tableau-3"></div>
                        <div class="tableau-label">4</div>
                    </div>
                    <div class="tableau-container">
                        <div class="tableau-pile" id="tableau-4"></div>
                        <div class="tableau-label">5</div>
                    </div>
                    <div class="tableau-container">
                        <div class="tableau-pile" id="tableau-5"></div>
                        <div class="tableau-label">6</div>
                    </div>
                    <div class="tableau-container">
                        <div class="tableau-pile" id="tableau-6"></div>
                        <div class="tableau-label">7</div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="game-status" id="game-status"></div>
        <div class="hint-container" id="hint-container"></div>
        
        <!-- Celebration Modal -->
        <div id="celebration-modal" class="modal">
            <div class="modal-content">
                <div class="celebration-animation">
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                    <div class="confetti"></div>
                </div>
                <h2>Congratulations! 🎉</h2>
                <p>You've won Klondike Solitaire!</p>
                <div class="final-stats">
                    <p>Final Score: <span id="final-score">0</span></p>
                    <p>Time: <span id="final-time">00:00</span></p>
                    <p>Moves: <span id="final-moves">0</span></p>
                </div>
                <button id="play-again-btn">Play Again</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
